<style>
/* ==========================================================================
   KasirWarung AI — Styles
   Warm "warung" look: orange awnings, yellow price tags, fresh green.
   Mobile-first · 18px base · 44px+ touch targets · 16px radius
   © 2026 KasirWarung AI · Made by Piyu
   ========================================================================== */
:root{
  --primary:#F97316; --primary-600:#EA580C; --primary-700:#C2410C; --primary-50:#FFF7ED; --primary-100:#FFEDD5; --primary-200:#FED7AA;
  --secondary:#FACC15; --secondary-100:#FEF9C3; --secondary-ink:#713F12;
  --accent:#16A34A; --accent-700:#15803D; --accent-50:#F0FDF4; --accent-100:#DCFCE7;
  --danger:#DC2626; --danger-50:#FEF2F2; --warn:#B45309; --warn-50:#FFFBEB;
  --ink:#1F2937; --ink-2:#374151; --muted:#6B7280; --line:#F1E6DA;
  --bg:#FFF8F0; --card:#FFFFFF;
  --radius:16px; --radius-sm:12px;
  --shadow:0 6px 20px rgba(124,45,18,.08), 0 1px 3px rgba(124,45,18,.06);
  --shadow-lg:0 18px 40px rgba(124,45,18,.18);
  --header-h:64px; --sidebar-w:252px; --bottom-h:72px;
  --s1:#1baf7a; --s2:#eb6834; --s3:#2a78d6; --s4:#4a3aa7;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:var(--primary-700)}
h1,h2,h3{line-height:1.2;margin:0 0 .5rem}
h1{font-size:1.5rem;font-weight:900}
h2{font-size:1.2rem;font-weight:900}
h3{font-size:1.02rem;font-weight:800}
p{margin:.25rem 0 .75rem}
small,.small{font-size:.8rem}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
.hidden,[hidden]{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--secondary);outline-offset:2px}

/* ---------- Header with awning ---------- */
.topbar{position:sticky;top:0;z-index:40;height:var(--header-h);display:flex;align-items:center;gap:.6rem;padding:0 12px;
  background:linear-gradient(180deg,var(--primary) 0%,var(--primary-600) 100%);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.05)}
.topbar::after{content:"";position:absolute;left:0;right:0;top:100%;height:12px;pointer-events:none;
  background:radial-gradient(circle at 12px 0,var(--primary-600) 11px,transparent 12px) repeat-x;background-size:24px 12px;
  filter:drop-shadow(0 3px 2px rgba(124,45,18,.18))}
.awning-stripes{position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,#fff 0 22px,transparent 22px 44px);opacity:.28}
.brand{display:flex;align-items:center;gap:.55rem;min-width:0;flex:1;color:#fff;text-decoration:none}
.brand-logo{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:0 0 auto;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-text{min-width:0;display:flex;flex-direction:column}
.brand-name{font-weight:900;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.brand-app{font-size:.72rem;font-weight:800;opacity:.95;display:flex;gap:.4rem;align-items:center;white-space:nowrap;overflow:hidden}
.badge-maker{background:var(--secondary);color:var(--secondary-ink);font-weight:900;font-size:.68rem;padding:2px 8px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.user-btn{display:flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);color:#fff;
  border-radius:999px;padding:4px 10px 4px 4px;min-height:44px;font:inherit;font-weight:800;font-size:.85rem;cursor:pointer}
.user-avatar{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--primary-700);display:grid;place-items:center;font-weight:900}
.user-name{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-menu{position:absolute;right:10px;top:calc(var(--header-h) + 8px);background:#fff;color:var(--ink);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  min-width:230px;padding:8px;z-index:60;animation:pop .16s ease-out}
.user-menu .um-head{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.user-menu button{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px;border-radius:10px;font:inherit;font-weight:700;min-height:44px;cursor:pointer;color:var(--ink)}
.user-menu button:hover{background:var(--primary-50)}

/* ---------- Layout ---------- */
.sidebar{display:none}
main#main{padding:24px 14px calc(var(--bottom-h) + 24px);max-width:1280px;margin:0 auto;min-width:0}
.footer{padding:18px 14px calc(var(--bottom-h) + 18px);text-align:center;color:var(--muted);font-size:.78rem;border-top:1px dashed var(--primary-200);background:#fffdf9}
.footer a{color:var(--primary-700);font-weight:800;text-decoration:none}
.footer .f-row{display:flex;flex-wrap:wrap;gap:.35rem .8rem;justify-content:center;align-items:center;margin:.2rem 0}
.footer .dot{opacity:.5}
body.auth .footer{padding-bottom:18px}
body.auth main#main{padding-bottom:24px}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:45;height:calc(var(--bottom-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:#fff;display:flex;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(124,45,18,.08)}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;font:inherit;
  font-size:.7rem;font-weight:800;color:var(--muted);min-height:44px;cursor:pointer;position:relative}
.bottomnav button svg{width:26px;height:26px}
.bottomnav button.active{color:var(--primary-700)}
.bottomnav button.active::before{content:"";position:absolute;top:0;left:25%;right:25%;height:4px;border-radius:0 0 6px 6px;background:var(--primary)}
.bottomnav .bn-badge{position:absolute;top:6px;right:calc(50% - 22px);background:var(--danger);color:#fff;border-radius:999px;font-size:.62rem;padding:0 5px;min-width:18px}

@media (min-width:768px){
  .sidebar{display:flex;flex-direction:column;position:fixed;top:calc(var(--header-h) + 12px);bottom:0;left:0;width:var(--sidebar-w);padding:16px 12px;overflow:auto;z-index:30}
  main#main,.footer{margin-left:var(--sidebar-w)}
  main#main{padding:28px 28px 40px}
  .footer{padding-bottom:22px}
  .bottomnav{display:none}
  body.auth .sidebar{display:none}
  body.auth main#main,body.auth .footer{margin-left:0}
}
.nav-item{display:flex;align-items:center;gap:.7rem;padding:12px 14px;border-radius:14px;color:var(--ink-2);font-weight:800;text-decoration:none;border:0;background:none;
  font:inherit;font-size:.95rem;width:100%;text-align:left;cursor:pointer;min-height:48px;transition:background .15s,transform .15s}
.nav-item svg{width:22px;height:22px;flex:0 0 auto;color:var(--primary-600)}
.nav-item:hover{background:var(--primary-50);transform:translateX(2px)}
.nav-item.active{background:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary-700)}
.nav-item.active svg{color:#fff}
.nav-sep{height:1px;background:var(--line);margin:10px 6px}
.nav-cta{margin-top:auto;background:var(--secondary-100);border-radius:var(--radius);padding:12px;font-size:.8rem;color:var(--secondary-ink)}

/* ---------- Pages ---------- */
.page{animation:fadeUp .28s ease-out}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.75rem;margin-bottom:1rem}
.page-head h1{margin:0}
.page-head .sub{color:var(--muted);font-size:.9rem;margin:.15rem 0 0}
.actions{display:flex;flex-wrap:wrap;gap:.5rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:minmax(0,1fr)}
.g3{grid-template-columns:minmax(0,1fr)}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:768px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stack>*+*{margin-top:14px}

/* ---------- Cards ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;border:1px solid #fff}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.6rem}
.card-head h2,.card-head h3{margin:0}
.card.tint-orange{background:linear-gradient(135deg,#fff 0%,var(--primary-50) 100%)}
.card.tint-yellow{background:linear-gradient(135deg,#fff 0%,var(--secondary-100) 100%)}
.card.tint-green{background:linear-gradient(135deg,#fff 0%,var(--accent-50) 100%)}

.kpi{position:relative;overflow:hidden}
.kpi .k-label{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;display:flex;gap:.35rem;align-items:center}
.kpi .k-value{font-size:1.35rem;font-weight:900;margin-top:4px;word-break:break-word}
.kpi .k-sub{font-size:.78rem;color:var(--muted);margin-top:2px}
.kpi .k-icon{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.kpi .k-icon svg{width:20px;height:20px}
.ic-orange{background:var(--primary-100);color:var(--primary-700)}
.ic-yellow{background:var(--secondary-100);color:var(--secondary-ink)}
.ic-green{background:var(--accent-100);color:var(--accent-700)}
.ic-red{background:var(--danger-50);color:var(--danger)}
@media (min-width:768px){.kpi .k-value{font-size:1.55rem}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:48px;padding:10px 18px;border-radius:14px;border:0;cursor:pointer;
  font:inherit;font-weight:900;font-size:.95rem;line-height:1.1;text-decoration:none;color:var(--ink);background:#fff;
  box-shadow:0 4px 0 var(--line),0 1px 0 rgba(0,0,0,.02) inset;border:2px solid var(--line);transition:transform .08s,box-shadow .08s,filter .15s;user-select:none}
.btn svg{width:20px;height:20px;flex:0 0 auto}
.btn:hover{filter:brightness(1.03)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 0 var(--primary-700)}
.btn-primary:active{box-shadow:0 1px 0 var(--primary-700)}
.btn-yellow{background:var(--secondary);color:var(--secondary-ink);border-color:var(--secondary);box-shadow:0 4px 0 #CA8A04}
.btn-yellow:active{box-shadow:0 1px 0 #CA8A04}
.btn-green{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 0 var(--accent-700)}
.btn-green:active{box-shadow:0 1px 0 var(--accent-700)}
.btn-danger{background:#fff;color:var(--danger);border-color:#FECACA;box-shadow:0 4px 0 #FECACA}
.btn-wa{background:#25D366;color:#073B1C;border-color:#25D366;box-shadow:0 4px 0 #128C7E}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--primary-700)}
.btn-ghost:active{box-shadow:none}
.btn-sm{min-height:44px;padding:6px 12px;font-size:.85rem;border-radius:12px}
.btn-lg{min-height:58px;font-size:1.1rem;padding:12px 22px}
.btn-block{width:100%}
.icon-btn{width:44px;height:44px;min-height:44px;padding:0;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:.3rem;min-height:40px;padding:6px 14px;border-radius:999px;background:#fff;border:2px solid var(--line);font:inherit;font-weight:800;font-size:.85rem;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* ---------- Badges & tags ---------- */
.badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.72rem;font-weight:900;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.3}
.b-green{background:var(--accent-100);color:var(--accent-700)}
.b-yellow{background:var(--secondary-100);color:var(--secondary-ink)}
.b-red{background:var(--danger-50);color:var(--danger)}
.b-orange{background:var(--primary-100);color:var(--primary-700)}
.b-gray{background:#F3F4F6;color:var(--ink-2)}
.b-ai{background:linear-gradient(90deg,#7C3AED,#DB2777);color:#fff}
.b-noai{background:#F3F4F6;color:var(--ink-2);border:1px dashed #9CA3AF}
.badge svg{width:14px;height:14px}
.price-tag{position:relative;display:inline-block;background:var(--secondary);color:var(--secondary-ink);font-weight:900;padding:4px 10px 4px 16px;border-radius:6px 10px 10px 6px;
  clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.price-tag::before{content:"";position:absolute;left:8px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#fff}
.price-tag.sm{font-size:.78rem;padding:2px 8px 2px 14px}
.price-tag.green{background:var(--accent-100);color:var(--accent-700)}

/* ---------- Forms ---------- */
.field{display:block;margin-bottom:12px}
.field>span,.field-label{display:block;font-weight:800;font-size:.85rem;margin-bottom:5px;color:var(--ink-2)}
.field .hint{font-size:.75rem;color:var(--muted);margin-top:4px;display:block;font-weight:600}
input,select,textarea{font:inherit;font-size:1rem;color:var(--ink);width:100%;min-width:0;min-height:48px;padding:10px 14px;border-radius:12px;border:2px solid #EADBCB;background:#fff;transition:border-color .15s,box-shadow .15s}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(249,115,22,.15)}
input[type=checkbox]{width:24px;height:24px;min-height:24px;accent-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-weight:800}
.switch input{appearance:none;width:56px;height:32px;min-height:32px;border-radius:999px;background:#E5E7EB;position:relative;cursor:pointer;border:0;padding:0;flex:0 0 auto}
.switch input::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .18s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:28px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;margin-top:-11px;width:22px;height:22px;color:var(--muted);pointer-events:none}
.search input{padding-left:46px;font-size:1.05rem;min-height:54px;border-radius:16px}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:78px}
.pw-wrap button{position:absolute;right:6px;top:6px;bottom:6px;border:0;background:var(--primary-50);color:var(--primary-700);font:inherit;font-weight:800;font-size:.8rem;border-radius:10px;padding:0 10px;cursor:pointer}

/* ---------- Tables → cards on phones ---------- */
.table-wrap{overflow-x:auto}
table.rtable{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem}
.rtable th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:10px;border-bottom:2px solid var(--line);white-space:nowrap}
.rtable td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.rtable tr:last-child td{border-bottom:0}
.rtable tbody tr:hover td{background:#FFFBF5}
.rtable .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:767px){
  .rtable thead{display:none}
  .rtable,.rtable tbody,.rtable tr,.rtable td{display:block;width:100%}
  .rtable tr{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:10px;box-shadow:0 2px 6px rgba(124,45,18,.05)}
  .rtable td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;padding:6px 0;text-align:right}
  .rtable td::before{content:attr(data-label);font-weight:800;color:var(--muted);font-size:.78rem;text-align:left;flex:0 0 auto}
  .rtable td.td-title{font-weight:900;font-size:1rem;text-align:left;justify-content:flex-start}
  .rtable td.td-title::before{display:none}
  .rtable td.td-actions{justify-content:flex-end;flex-wrap:wrap}
  .rtable td.td-actions::before{display:none}
  .rtable .n{white-space:normal}
}

/* ---------- Lists ---------- */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.list li:last-child{border-bottom:0}
.list .li-main{flex:1;min-width:0}
.list .li-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .li-sub{font-size:.78rem;color:var(--muted)}

/* ---------- Notices ---------- */
.notice{border-radius:14px;padding:12px 14px;font-size:.9rem;display:flex;gap:.6rem;align-items:flex-start;margin-bottom:12px}
.notice svg{width:22px;height:22px;flex:0 0 auto;margin-top:1px}
.n-warn{background:var(--warn-50);color:#78350F;border:1px solid #FDE68A}
.n-info{background:var(--primary-50);color:var(--primary-700);border:1px solid var(--primary-200)}
.n-ok{background:var(--accent-50);color:var(--accent-700);border:1px solid #BBF7D0}
.n-err{background:var(--danger-50);color:#991B1B;border:1px solid #FECACA}
.license-banner{background:var(--secondary);color:var(--secondary-ink);font-weight:800;font-size:.85rem;padding:8px 14px;text-align:center}
.license-banner a{color:inherit}

/* ---------- Empty states ---------- */
.empty{text-align:center;padding:22px 12px;color:var(--muted)}
.empty svg{width:150px;height:auto;margin:0 auto 8px;display:block}
.empty h3{color:var(--ink-2);margin-bottom:.2rem}
.empty p{margin:0 auto;max-width:340px;font-size:.88rem}

/* ---------- Modal / sheet ---------- */
.modal-wrap{position:fixed;inset:0;z-index:80;background:rgba(31,41,55,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.modal{background:#fff;width:100%;max-width:640px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:sheetUp .22s ease-out;box-shadow:var(--shadow-lg)}
.modal.wide{max-width:900px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:1.1rem}
.modal-body{padding:16px;overflow:auto;flex:1}
.modal-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.modal-foot .btn{flex:1 1 140px}
.modal-grip{width:44px;height:5px;border-radius:5px;background:#E5E7EB;margin:8px auto 0}
@media (min-width:768px){.modal-wrap{align-items:center}.modal{border-radius:22px}.modal-grip{display:none}}

/* ---------- Toast & busy ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--bottom-h) + 16px);transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px);pointer-events:none}
@media (min-width:768px){#toast{bottom:24px}}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:14px;font-weight:800;font-size:.85rem;box-shadow:var(--shadow-lg);animation:toastIn .22s ease-out;display:flex;gap:.5rem;align-items:center;pointer-events:auto}
.toast.ok{background:var(--accent-700)}
.toast.err{background:#B91C1C}
.toast svg{width:20px;height:20px;flex:0 0 auto}
#busy{position:fixed;inset:0;z-index:120;background:rgba(255,248,240,.72);display:grid;place-items:center;backdrop-filter:blur(2px)}
.busy-box{background:#fff;border-radius:18px;padding:18px 22px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;font-weight:800}
.spinner{width:26px;height:26px;border-radius:50%;border:4px solid var(--primary-100);border-top-color:var(--primary);animation:spin .8s linear infinite;flex:0 0 auto}
.spinner.sm{width:18px;height:18px;border-width:3px}
.skeleton{background:linear-gradient(90deg,#F5EDE4 25%,#FBF6F0 50%,#F5EDE4 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:10px;min-height:18px}

/* ---------- Boot splash ---------- */
#bootSplash{position:fixed;inset:0;z-index:150;background:var(--bg);display:grid;place-items:center;text-align:center}
#bootSplash .bs-logo{width:92px;height:92px;margin:0 auto 12px;animation:bob 1.2s ease-in-out infinite}
#bootSplash .bs-name{font-weight:900;font-size:1.3rem;color:var(--primary-700)}

/* ---------- Auth ---------- */
.auth-wrap{min-height:calc(100vh - 220px);display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-items:center;padding:8px 0}
.auth-card{width:100%;max-width:440px;padding:22px}
